name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.402

      - name: Restore
        run: dotnet restore PondashiEX.sln --configfile NuGet.Config --locked-mode

      - name: Audit dependencies
        run: dotnet list PondashiEX.sln package --vulnerable --include-transitive --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format PondashiEX.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PondashiEX.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PondashiEX.sln --configuration Release --no-build --no-restore
