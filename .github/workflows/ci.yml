name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.425

      - name: Restore
        run: dotnet restore PondashiEX.sln --configfile NuGet.Config --locked-mode

      - name: Audit dependencies
        run: dotnet list PondashiEX.sln package --vulnerable --include-transitive --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format PondashiEX.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PondashiEX.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PondashiEX.sln --configuration Release --no-build --no-restore
